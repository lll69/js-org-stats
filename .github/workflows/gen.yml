name: Generate Stats

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: 'lll69/js-org-stats-generate'
        ref: 'js-dev'

    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.12.3'

    - name: Use Node.js 24.18.0
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24.18.0

    - name: Clone js.org
      run: git clone https://github.com/js-org/js.org.git js.org

    - run: pip install -r requirements.txt

    - run: npm install

    - name: Generate
      run: |
        npx tsx pulls.ts ${{ secrets.GITHUB_TOKEN }}
        npx tsx stat.ts
        python svg.py

    - name: Push Stats
      uses: lll69/ghpages@eb08c35b9fab86751edfff4e55cd5cde35ff0e52 # v3
      with:
        target_branch: stat
        build_dir: dist
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
